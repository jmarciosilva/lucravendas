services:

  # ─── Aplicação PHP-FPM ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lucravendas_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
    networks:
      - lucravendas
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Servidor web Nginx ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: lucravendas_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lucravendas
    depends_on:
      - app

  # ─── Banco de dados MySQL ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: lucravendas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: lucravendas
      MYSQL_USER: lucravendas
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - lucravendas
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "lucravendas", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (cache, sessões e filas) ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: lucravendas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lucravendas
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Meilisearch (motor de busca) ────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: lucravendas_meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: "${MEILISEARCH_KEY:-masterKey}"
      # Meilisearch aceita apenas 'development' ou 'production' — não 'local'
      MEILI_ENV: "development"
    networks:
      - lucravendas

  # ─── phpMyAdmin (interface web para o banco de dados) ───────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: lucravendas_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: lucravendas
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 64M
    networks:
      - lucravendas
    depends_on:
      mysql:
        condition: service_healthy

  # ─── Mailpit (captura de e-mails em desenvolvimento) ─────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: lucravendas_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Interface web
    networks:
      - lucravendas

networks:
  lucravendas:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  meilisearch_data:
