[www]
user = www-data
group = www-data

; Modo dinâmico — ajusta workers conforme a demanda
pm = dynamic

; Número máximo de workers PHP-FPM simultâneos
; Filament/Livewire faz múltiplas requisições em paralelo na mesma página
pm.max_children = 20

; Workers iniciados na subida do container
pm.start_servers = 4

; Mínimo de workers ociosos mantidos em standby
pm.min_spare_servers = 2

; Máximo de workers ociosos antes de liberar memória
pm.max_spare_servers = 8

; Reinicia o worker após 500 requisições para evitar vazamento de memória gradual
pm.max_requests = 500

; Expõe o status do pool em /fpm-status (útil para debug de performance)
pm.status_path = /fpm-status
